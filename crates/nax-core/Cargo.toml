[package]
name = "nax-core"
description = "Nanarchive compression core and .nax format"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
blake3 = "1.8.7"
getrandom = "0.3"
reed-solomon-simd = "3"
zeroize = "1"
crc32fast = "1.5.4"
filetime = "0.2.29"
lepton_jpeg = "0.5.8"
# Bundled static liblzma with pre-generated bindings (no clang needed).
# Used directly (not via the `liblzma` crate) for preset dictionaries.
liblzma-sys = { version = "0.4.9", features = ["static"] }
miniz_oxide = "0.8.9"
preflate-rs = "0.7.6"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
thiserror.workspace = true
walkdir = "2.5.0"
zstd = "0.14.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
filetime = "0.2.29"
jpeg-encoder = "0.7.1"
liblzma-sys = "0.4.9"
ppmd-rust = "1.5.2"
tempfile = "3.27.0"
