[package]
name = "nax-core"
description = "Nanarchive compression core and .nax format"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
blake3 = "1.8.7"
filetime = "0.2.29"
# Bundled static liblzma, pre-generated bindings (no clang needed).
liblzma = { version = "0.4.9", default-features = false, features = ["static"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
thiserror.workspace = true
walkdir = "2.5.0"
zstd = "0.14.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
filetime = "0.2.29"
tempfile = "3.27.0"
