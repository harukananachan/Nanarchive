[package]
name = "nax-cli"
description = "Nanarchive command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "nax"
path = "src/main.rs"

[dependencies]
nax-core.workspace = true
clap.workspace = true
indicatif = "0.18.6"
anyhow = "1.0.104"
ctrlc = "3.5.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
