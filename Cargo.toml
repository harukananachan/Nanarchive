[workspace]
resolver = "2"
members = ["crates/nax-core", "crates/nax-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Unlicense"
authors = ["Claude Opus 5.5"]

[workspace.dependencies]
nax-core = { path = "crates/nax-core" }
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# `tauri dev` builds in debug; keep the engine and its codecs fast there.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.nax-core]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind (not abort): third-party image codecs are wrapped in catch_unwind
# so a damaged file can't crash the program.
strip = true
