[package]
name = "nax-app"
description = "Nanarchive desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows.
name = "nax_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nax-core.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "lzma", "bzip2"] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }
